<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War Server World Map</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        #viewer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            cursor: grab;
            background: #111;
            touch-action: none;
        }

        #viewer.dragging {
            cursor: grabbing;
        }

        #image {
            position: absolute;
            left: 50%;
            top: 50%;
            max-width: none;
            user-select: none;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform;
        }

        #controls {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10;

            display: flex;
            gap: 8px;
            align-items: center;

            padding: 10px;

            background: rgba(0, 0, 0, 0.75);
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        button {
            border: none;
            background: #333;
            color: white;
            padding: 9px 13px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #555;
        }

        #zoomLevel {
            min-width: 55px;
            text-align: center;
            font-size: 14px;
        }

        #info {
            position: fixed;
            bottom: 15px;
            left: 15px;

            padding: 8px 12px;

            background: rgba(0, 0, 0, 0.65);
            border-radius: 6px;

            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div id="viewer">
        <img id="image" src="images/earth-map.jpg" alt="Earth map">
    </div>

    <div id="controls">
        <button id="zoomOut">−</button>

        <span id="zoomLevel">100%</span>

        <button id="zoomIn">+</button>

        <button id="reset">↻ Reset</button>
    </div>

    <div id="info">
        Scroll = Zoom &nbsp; | &nbsp; Drag = Pan
    </div>

    <script>
        const viewer = document.getElementById("viewer");
        const image = document.getElementById("image");

        const zoomInButton = document.getElementById("zoomIn");
        const zoomOutButton = document.getElementById("zoomOut");
        const resetButton = document.getElementById("reset");

        const zoomLevel = document.getElementById("zoomLevel");

        let scale = 1;
        let targetScale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let targetOffsetX = 0;
        let targetOffsetY = 0;
        let dragging = false;
        let pointerId = null;
        let lastX = 0;
        let lastY = 0;
        let velocityX = 0;
        let velocityY = 0;
        let animationFrame = null;

        function updateImage() {
            image.style.transform =
                `translate(-50%, -50%) translate(${offsetX}px, ${offsetY}px) scale(${scale})`;

            zoomLevel.textContent = Math.round(scale * 100) + "%";
        }

        function animate() {
            const scaleDifference = targetScale - scale;
            const offsetDifferenceX = targetOffsetX - offsetX;
            const offsetDifferenceY = targetOffsetY - offsetY;

            scale += scaleDifference * 0.2;
            offsetX += offsetDifferenceX * 0.2 + velocityX;
            offsetY += offsetDifferenceY * 0.2 + velocityY;
            velocityX *= 0.86;
            velocityY *= 0.86;

            updateImage();

            const stillMoving = Math.abs(scaleDifference) > 0.001 ||
                Math.abs(offsetDifferenceX) > 0.1 ||
                Math.abs(offsetDifferenceY) > 0.1 ||
                Math.abs(velocityX) > 0.1 ||
                Math.abs(velocityY) > 0.1;

            if (stillMoving) {
                animationFrame = requestAnimationFrame(animate);
            } else {
                scale = targetScale;
                offsetX = targetOffsetX;
                offsetY = targetOffsetY;
                velocityX = 0;
                velocityY = 0;
                animationFrame = null;
                updateImage();
            }
        }

        function startAnimation() {
            if (animationFrame === null) {
                animationFrame = requestAnimationFrame(animate);
            }
        }

        function zoom(factor, mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2) {
            const oldScale = targetScale;
            const newScale = Math.max(0.05, Math.min(oldScale * factor, 20));
            const rect = viewer.getBoundingClientRect();
            const centerX = mouseX - rect.left - rect.width / 2;
            const centerY = mouseY - rect.top - rect.height / 2;

            // Keep the exact image point under the cursor fixed while scaling.
            const scaleRatio = 1 - newScale / oldScale;
            targetOffsetX += (centerX - targetOffsetX) * scaleRatio;
            targetOffsetY += (centerY - targetOffsetY) * scaleRatio;
            targetScale = newScale;
            startAnimation();
        }

        function resetView() {
            targetScale = 1;
            targetOffsetX = 0;
            targetOffsetY = 0;
            startAnimation();
        }

        // Zoom buttons
        zoomInButton.addEventListener("click", () => {
            zoom(1.25);
        });

        zoomOutButton.addEventListener("click", () => {
            zoom(0.8);
        });

        resetButton.addEventListener("click", resetView);

        // Mouse wheel zoom
        viewer.addEventListener("wheel", function (event) {
            event.preventDefault();

            const factor = event.deltaY < 0 ? 1.15 : 1 / 1.15;

            zoom(factor, event.clientX, event.clientY);
        }, { passive: false });

        // Start dragging
        viewer.addEventListener("pointerdown", function (event) {
            if (event.button !== 0) return;
            dragging = true;
            pointerId = event.pointerId;
            lastX = event.clientX;
            lastY = event.clientY;
            velocityX = 0;
            velocityY = 0;
            viewer.setPointerCapture(pointerId);
            viewer.classList.add("dragging");
        });

        viewer.addEventListener("pointermove", function (event) {
            if (!dragging || event.pointerId !== pointerId) return;

            const movementX = event.clientX - lastX;
            const movementY = event.clientY - lastY;
            offsetX += movementX;
            offsetY += movementY;
            targetOffsetX = offsetX;
            targetOffsetY = offsetY;
            velocityX = movementX;
            velocityY = movementY;
            lastX = event.clientX;
            lastY = event.clientY;
            updateImage();
        });

        viewer.addEventListener("pointerup", function (event) {
            if (event.pointerId !== pointerId) return;
            dragging = false;
            viewer.releasePointerCapture(pointerId);
            pointerId = null;
            viewer.classList.remove("dragging");
            startAnimation();
        });

        viewer.addEventListener("pointercancel", function () {
            dragging = false;
            pointerId = null;
            viewer.classList.remove("dragging");
            startAnimation();
        });

        // Keyboard controls
        window.addEventListener("keydown", function (event) {

            if (event.key === "+" || event.key === "=") {
                zoom(1.25);
            }

            if (event.key === "-" || event.key === "_") {
                zoom(0.8);
            }

            if (event.key === "0") {
                resetView();
            }
        });
        updateImage();
    </script>

</body>
</html>
