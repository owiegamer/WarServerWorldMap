<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War Server World Map</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        #viewer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            cursor: grab;
            background: #111;
        }

        #viewer.dragging {
            cursor: grabbing;
        }

        #image {
            position: absolute;
            left: 50%;
            top: 50%;
            max-width: none;
            user-select: none;
            pointer-events: none;
            transform-origin: center center;
        }

        #controls {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10;

            display: flex;
            gap: 8px;
            align-items: center;

            padding: 10px;

            background: rgba(0, 0, 0, 0.75);
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        button {
            border: none;
            background: #333;
            color: white;
            padding: 9px 13px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #555;
        }

        #zoomLevel {
            min-width: 55px;
            text-align: center;
            font-size: 14px;
        }

        #info {
            position: fixed;
            bottom: 15px;
            left: 15px;

            padding: 8px 12px;

            background: rgba(0, 0, 0, 0.65);
            border-radius: 6px;

            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div id="viewer">
        <img id="image" src="images/earth-map.jpg" alt="Earth map">
    </div>

    <div id="controls">
        <button id="zoomOut">−</button>

        <span id="zoomLevel">100%</span>

        <button id="zoomIn">+</button>

        <button id="reset">↻ Reset</button>
    </div>

    <div id="info">
        Scroll = Zoom &nbsp; | &nbsp; Drag = Pan
    </div>

    <script>
        const viewer = document.getElementById("viewer");
        const image = document.getElementById("image");

        const zoomInButton = document.getElementById("zoomIn");
        const zoomOutButton = document.getElementById("zoomOut");
        const resetButton = document.getElementById("reset");

        const zoomLevel = document.getElementById("zoomLevel");

        let scale = 1;

        let offsetX = 0;
        let offsetY = 0;

        let dragging = false;

        let startX = 0;
        let startY = 0;

        function updateImage() {
            image.style.transform =
                `translate(-50%, -50%) translate(${offsetX}px, ${offsetY}px) scale(${scale})`;

            zoomLevel.textContent = Math.round(scale * 100) + "%";
        }

        function zoom(factor, mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2) {
            const oldScale = scale;

            scale = Math.max(0.05, Math.min(oldScale * factor, 20));

            // Keep the point underneath the mouse stationary while zooming
            const rect = viewer.getBoundingClientRect();

            const centerX = mouseX - rect.left - rect.width / 2;
            const centerY = mouseY - rect.top - rect.height / 2;

            offsetX += centerX * (1 / oldScale - 1 / scale);
            offsetY += centerY * (1 / oldScale - 1 / scale);

            updateImage();
        }

        function resetView() {
            scale = 1;
            offsetX = 0;
            offsetY = 0;

            updateImage();
        }

        // Zoom buttons
        zoomInButton.addEventListener("click", () => {
            zoom(1.25);
        });

        zoomOutButton.addEventListener("click", () => {
            zoom(0.8);
        });

        resetButton.addEventListener("click", resetView);

        // Mouse wheel zoom
        viewer.addEventListener("wheel", function (event) {
            event.preventDefault();

            const factor = event.deltaY < 0 ? 1.15 : 1 / 1.15;

            zoom(factor, event.clientX, event.clientY);
        }, { passive: false });

        // Start dragging
        viewer.addEventListener("mousedown", function (event) {
            if (event.button !== 0) return;

            dragging = true;

            startX = event.clientX - offsetX;
            startY = event.clientY - offsetY;

            viewer.classList.add("dragging");
        });

        // Drag image
        window.addEventListener("mousemove", function (event) {
            if (!dragging) return;

            offsetX = event.clientX - startX;
            offsetY = event.clientY - startY;

            updateImage();
        });

        // Stop dragging
        window.addEventListener("mouseup", function () {
            dragging = false;
            viewer.classList.remove("dragging");
        });

        // Keyboard controls
        window.addEventListener("keydown", function (event) {

            if (event.key === "+" || event.key === "=") {
                zoom(1.25);
            }

            if (event.key === "-" || event.key === "_") {
                zoom(0.8);
            }

            if (event.key === "0") {
                resetView();
            }
        });
        updateImage();
    </script>

</body>
</html>
